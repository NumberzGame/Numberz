name: Playwright Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        os: [
          "ubuntu-latest",
        ]   
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Build and setup the Numberz game site files, ready for being served.
      # This will run the local action from the repo checked out above, which could be external.
      # Double check the action.yml file is safe if using this on untrusted repos.
      uses: ./.github/actions/pre_deploy

    # npm is set up in the previous action 
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright with deps
      run: |
        npx playwright install --with-deps

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.15'

    # Don't use python -m http.server in prod.
    # But for internal testing, unlike the 
    # Vite dev server, it doesn't eagerly index 
    # all the files, even if they may never be requested.
    - name: Start http server
      shell: bash
      working-directory: ./dist
      run: |
        python -m http.server 8000 &
        echo "HTTP_SERVER_PID=$!" >> $GITHUB_ENV
        sleep 4  # give server time to start

    - name: ENsure screenshots dir exists
      run: mkdir -p playwright-screenshots

    - name: Run Playwright tests
      run: npx playwright test

    - name: Stop http server
      shell: bash
      run: |
        echo Killing http server process ID: ${{ env.HTTP_SERVER_PID }}
        kill ${{ env.HTTP_SERVER_PID }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-screenshots
        path: playwright-screenshots/
        retention-days: 30
