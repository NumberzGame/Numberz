name:
  Deploy the Numberz Game to a directory  
description:
  Setup the Numberz game static files, ready for serving (e.g. by an off the shelf http file server).

  
inputs:
  built_dir:
    required: false
    default: "./dist"
    description: 'The dir that will contain the static site (and all other build outputs). '
    


runs:
  using: "composite"
  steps:
    # This action's parent repo is required to already be checked out 
    # (as some test workflows must have it checked out anyway)
    # into the working dir, e.g. from an external repo's calling workflow:
    #
    # steps:
    # - uses: actions/checkout@v6
    #   with:
    #     path: ./NumberzGame_to_deploy
    #
    # - name: Set up Numberz Game for deployment
    #   uses: ./NumberzGame_to_deploy/.github/actions/pre_deploy


    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build
      shell: bash
      run: npm run build -- --outDir ${{ inputs.built_dir }}
      
    # This is a bit of a hack of Vite and Github pages, but if manually moving in
    # static content, the Vite build done in the previous step must be done before
    # the steps (e.g. those below) adding anything into ./dist (or outDir).
    # I'm not sure exactly why, but the static assets 404 if the order is otherwise.

    - name: Download pictures
      shell: bash
      run: curl -L https://github.com/NumberzGame/NumberzGame.github.io/releases/download/v0.0.0/pictures.zip -o pictures.zip

    - name: Unzip pictures
      shell: bash
      run: unzip pictures.zip

    - name: Move pictures to dist
      shell: bash
      run: |
        mv *.jpg ${{ inputs.built_dir }}

    - name: Download and unzip solutions cache
      # This will run the local action from the supplied checked out repo, which could be external.
      # Double check the action.yml file within is safe, and do not use this technique on untrusted repos.
      uses: $/.github/actions/download_solutions_cache
      with:
        dir: ${{ inputs.built_dir }}
